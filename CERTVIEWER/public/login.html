<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Вход — Реестр сертификатов</title>
<style>
  /* Фирменный стиль Росстата — единая тема с платформой и остальными модулями.
     Значения продублированы прямо здесь, а не взяты из app.css, потому что
     страница входа обязана открываться и тогда, когда всё остальное недоступно.
     Держите их в согласии с public/app.css при правках. */
  @font-face {
    font-family: "PT Root UI";
    src: url("/fonts/PTRootUI-Regular.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "PT Root UI";
    src: url("/fonts/PTRootUI-Bold.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: swap;
  }
  :root {
    --md-primary: #0A61AE;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #DCE7F6;
    --md-on-primary-container: #0A61AE;
    --md-surface: #E8EDF5;
    --md-surface-container: #FFFFFF;
    --md-surface-container-lowest: #FFFFFF;
    --md-on-surface: #282A2E;
    --md-on-surface-variant: #838383;
    --md-outline: #DCE4EF;
    --md-outline-variant: #E4EAF3;
    --md-error: #E7004B;
    --md-shape-xs: 4px;
    --md-shape-m: 8px;
    --md-shape-xl: 12px;
    --md-shape-full: 6px;
    --sans: "PT Root UI", Arial, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  /* Кернинг выключен: в PT Root UI пара «пробел + длинное тире» стягивает
     пробелы в ноль. Подробности — в public/app.css. */
  html { font-kerning: none; }
  * { box-sizing: border-box; }
  /* --- Полоса прокрутки ---
     Штатная светло-серая полоса Chromium выбивалась из палитры. Стилизуем
     через ::-webkit-scrollbar: эти псевдоэлементы понимают все Chromium, включая
     109-й на рабочих машинах. Стандартные scrollbar-width/scrollbar-color
     появились только в Chrome 121 — они ниже и лишь повторяют тот же вид в новых
     браузерах и в Firefox. Прозрачная рамка с background-clip даёт отступ от
     края, чтобы полоса не липла к содержимому. */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--md-outline-variant);
    border: 3px solid transparent;
    background-clip: padding-box;
    border-radius: var(--md-shape-full);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--md-outline); background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  /* scrollbar-width/-color наследуются, поэтому достаточно корня. */
  html { scrollbar-width: thin; scrollbar-color: var(--md-outline-variant) transparent; }

  body {
    font-family: var(--sans);
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--md-surface-container);
    color: var(--md-on-surface);
    -webkit-font-smoothing: antialiased;
  }

  .box {
    background: var(--md-surface-container-lowest);
    border-radius: var(--md-shape-xl);
    padding: 40px 36px 32px;
    width: 360px;
    box-shadow: 0 6px 18px rgba(31, 27, 22, 0.12);
  }
  .seal {
    display: flex; justify-content: center; align-items: center; margin: 0 auto 18px;
    width: 56px; height: 56px; border-radius: var(--md-shape-m);
    background: var(--md-primary-container); color: var(--md-on-primary-container);
  }
  .box h1 {
    font-size: 22px; font-weight: 600; margin: 0 0 6px; color: var(--md-on-surface); text-align: center;
  }
  .box .subtitle {
    text-align: center; font-size: 13.5px; color: var(--md-on-surface-variant);
    margin-bottom: 26px; letter-spacing: 0; text-transform: none;
  }
  label { display: block; font-size: 12.5px; font-weight: 500; color: var(--md-on-surface-variant); margin: 14px 0 7px; }
  input {
    width: 100%; padding: 14px 16px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--md-outline); border-radius: var(--md-shape-xs);
    background: var(--md-surface-container-lowest); color: var(--md-on-surface); outline: none;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  input:focus { border-color: var(--md-primary); box-shadow: inset 0 0 0 1px var(--md-primary); }
  button {
    width: 100%; margin-top: 26px; padding: 14px;
    background: var(--md-primary); color: var(--md-on-primary);
    border: none; border-radius: var(--md-shape-full);
    font-size: 14px; font-weight: 600; letter-spacing: 0.1px; cursor: pointer;
    transition: box-shadow 0.15s, filter 0.15s;
  }
  button:hover { box-shadow: 0 1px 2px rgba(31, 27, 22, 0.10); filter: brightness(1.06); }
  #error { color: var(--md-error); font-size: 13px; margin-top: 14px; min-height: 18px; text-align: center; }
</style>
</head>
<body>
  <div class="box">
    <div class="seal">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 12.2l2.6 2.6L16.2 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Реестр сертификатов сотрудников</h1>
    <div class="subtitle">Вход в систему</div>
    <form id="loginForm">
      <label for="username">Логин</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus />
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <button type="submit">Войти</button>
      <div id="error"></div>
    </form>
  </div>

<script>
const form = document.getElementById('loginForm');
const errorEl = document.getElementById('error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.textContent = '';
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  try {
    const resp = await fetch('login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (resp.ok) {
      window.location.href = './';
    } else {
      const data = await resp.json().catch(() => ({}));
      errorEl.textContent = data.error || 'Не удалось войти';
    }
  } catch (err) {
    errorEl.textContent = 'Ошибка соединения: ' + err.message;
  }
});
</script>
</body>
</html>
