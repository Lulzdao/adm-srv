<!doctype html>
<html lang="ru" data-theme="light" data-accent="azure">
<head>
<meta charset="utf-8">
<!-- Только свои скрипты, стили, шрифты и картинки; сеть — к серверу «Искры» (адрес задаётся настройкой,
     поэтому схемы, а не имя). Встроенный код запрещён целиком — скрипт окна в отдельном файле; style= разрешён. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src http: https: ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>Искра</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="roster.css">
<link rel="stylesheet" href="redesign.css">
</head>
<body>

<div class="wintitlebar">
  <span class="title" id="wtBrand"><span class="brand-dot"></span>Искра</span>
  <!-- Шапка экрана настроек: появляется вместо названия, пока открыта панель (body.settings-open). -->
  <span class="title-settings" id="wtSettings"><button class="icon-btn" id="ppBack" title="Назад к списку"></button><span>Настройки</span></span>
  <div class="wctl">
    <button class="icon-btn" id="wcMin"></button>
    <button class="icon-btn" id="wcMax"></button>
    <button class="icon-btn close" id="wcClose"></button>
  </div>
</div>

<div id="auth">
  <div class="auth-hero"><div class="auth-glow"></div><svg id="authLogo" viewBox="74 16 52 110"><path d="M98.09 95.38 L98.87 90.06 L100.00 20.00 L101.13 90.06 L101.91 95.38 L103.61 95.21 L109.19 90.81 L104.79 96.39 L104.62 98.09 L109.90 98.61 L122.00 100.00 L109.90 101.39 L104.62 101.91 L104.79 103.61 L109.19 109.19 L103.61 104.79 L101.91 104.62 L101.39 109.90 L100.00 122.00 L98.61 109.90 L98.09 104.62 L96.39 104.79 L90.81 109.19 L95.21 103.61 L95.38 101.91 L90.10 101.39 L78.00 100.00 L90.10 98.61 L95.38 98.09 L95.21 96.39 L90.81 90.81 L96.39 95.21 Z"/></svg></div>
  <h1>Искра</h1>
  <div class="auth-subtitle">Корпоративный мессенджер Липецкстата</div>
  <div class="err" id="authErr"></div>
  <form id="authForm">
    <label class="auth-field"><span>Логин</span><input id="username" placeholder="Иванов Иван Иванович"></label>
    <label class="auth-field"><span>Пароль</span><input id="password" type="password" placeholder="••••••••"></label>
    <div class="caps-hint" id="capsHint"><span></span>Включён Caps Lock</div>
    <button class="primary" type="submit">Войти</button>
  </form>
  <div class="switch" id="switchMode">Нет аккаунта? <b>Зарегистрироваться</b></div>
  <div class="conn-hint" id="connHint"></div>
</div>

<div id="app">
  <div id="topSlot">
    <div id="me-bar">
      <div class="avatar" id="meAvatar"><span class="dot active" id="meDot" title="В сети"></span></div>
      <div class="me-text"><div class="name" id="meName"></div><div class="sub" id="meSub"></div></div>
      <span class="insecure-badge" id="insecureBadge" title="Соединение с сервером не шифруется">без шифрования</span>
      <span class="gear"></span>
    </div>
  </div>
  <!-- Поиск виден всегда; печатать можно и не щёлкая по нему — см. обработчик keydown в roster.js. -->
  <div id="searchBar"><span class="sb-icon" id="searchIcon"></span><input id="searchInput" placeholder="Найти сотрудника"><span class="sb-hint">начните печатать</span></div>
  <div id="profilePanel">
    <div class="inner">
      <div class="pp-card pp-me">
        <div class="pp-emblem" id="ppEmblem"></div>
        <div class="pp-me-text"><div class="t" id="ppFullName"></div><div class="d" id="ppDept"></div></div>
      </div>

      <div class="section-title">Оформление</div>
      <div class="pp-card inset">
        <div class="pp-row">
          <span class="t">Тема</span>
          <div class="theme-seg">
            <button id="ppThemeDark"><span class="i"></span>Тёмная</button>
            <button id="ppThemeLight"><span class="i"></span>Светлая</button>
          </div>
        </div>
        <div class="pp-row">
          <span class="t">Акцент</span>
          <div class="accent-pick" id="ppAccent">
            <button data-accent="ember" title="Янтарь"></button>
            <button data-accent="garnet" title="Гранат"></button>
            <button data-accent="gold" title="Латунь"></button>
            <button data-accent="jade" title="Малахит"></button>
            <button data-accent="azure" title="Лазурь"></button>
            <button data-accent="violet" title="Аметист"></button>
          </div>
        </div>
        <div class="pp-row col" title="Пропорционально увеличивает или уменьшает весь интерфейс — текст, значки, отступы.">
          <div class="pp-line"><span class="t">Масштаб интерфейса</span><span class="v" id="ppUiScaleLabel">100%</span></div>
          <input type="range" id="ppUiScale" min="70" max="130" step="1" value="100">
        </div>
      </div>

      <div class="section-title">Окна и чаты</div>
      <div class="pp-card">
        <label class="pp-row" title="Всплывающие уведомления Windows о новых сообщениях и объявлениях. Если выключить, о новом сообщении скажут мигающая кнопка окна и число у значка в трее.">
          <span class="t">Уведомления Windows</span>
          <span class="pp-switch"><input type="checkbox" id="ppNotifications"><span class="pp-switch-track"></span></span>
        </label>
        <label class="pp-row" title="Вместо системного уведомления сразу откроется окно с новым сообщением.">
          <span class="t">Открывать чат при новом сообщении</span>
          <span class="pp-switch"><input type="checkbox" id="ppOpenChatOnMessage"><span class="pp-switch-track"></span></span>
        </label>
        <label class="pp-row" title="Список и окна чатов будут открываться с тем размером, который вы задали в последний раз.">
          <span class="t">Запоминать размер окон</span>
          <span class="pp-switch"><input type="checkbox" id="ppRememberWindowSize"><span class="pp-switch-track"></span></span>
        </label>
        <label class="pp-row" title="Окна мессенджера всегда будут отображаться над другими приложениями.">
          <span class="t">Поверх остальных окон</span>
          <span class="pp-switch"><input type="checkbox" id="ppAlwaysOnTop"><span class="pp-switch-track"></span></span>
        </label>
        <label class="pp-row" title="Мессенджер будет запускаться сам, когда вы входите в Windows под своей учётной записью.">
          <span class="t">Запускать при входе в Windows</span>
          <span class="pp-switch"><input type="checkbox" id="ppAutoStart"><span class="pp-switch-track"></span></span>
        </label>
        <label class="pp-row" title="Не повторять имя собеседника в каждом сообщении личного чата — только в шапке окна.">
          <span class="t">Скрывать имя в сообщениях</span>
          <span class="pp-switch"><input type="checkbox" id="ppHideNames"><span class="pp-switch-track"></span></span>
        </label>
        <div class="pp-row" title="Через сколько минут без движения мыши и клавиатуры статус переключается на «Отошёл».">
          <span class="t">«Отошёл» через</span>
          <span class="pp-stepper"><button type="button" id="ppIdleMinus">−</button><input type="number" id="ppIdleThresholdMinutes" min="1" max="30" step="1"><span class="u">мин</span><button type="button" id="ppIdlePlus">+</button></span>
        </div>
        <div class="pp-row col" title="Если папка указана — файлы из чата сохраняются сразу в неё, без окна «Сохранить как».">
          <div class="pp-line"><span class="t">Папка для файлов</span></div>
          <div class="pp-line"><div id="ppDownloadPathLabel"></div><button id="ppPickFolderBtn" class="pp-link">Выбрать</button><button id="ppClearFolderBtn" class="icon-btn" title="Спрашивать каждый раз"></button></div>
        </div>
      </div>

      <div class="section-title">Система</div>
      <div class="pp-card">
        <div class="pp-row sys" id="ppConnRow"><span class="sdot"></span><span class="t" id="ppConnState">—</span><span class="v" id="ppConnDetail"></span></div>
        <div class="pp-row sys" id="ppUpdateRow"><span class="sdot upd"></span><span class="t" id="ppUpdateStatus">Проверка не выполнялась</span>
          <button class="pp-link" id="ppCheckUpdateBtn">Проверить</button>
          <button class="pp-link" id="ppInstallUpdateBtn" style="display:none;">Перезапустить</button>
        </div>
        <label class="pp-row" title="Новая версия скачается сама и установится при следующем выходе из приложения. Работу это не прерывает.">
          <span class="t">Обновлять автоматически</span>
          <span class="pp-switch"><input type="checkbox" id="ppAutoUpdate"><span class="pp-switch-track"></span></span>
        </label>
      </div>

      <div class="pp-about" id="ppAbout"></div>
      <button id="ppLogoutBtn">Выйти из аккаунта</button>
    </div>
  </div>
  <div id="historyRow" class="row" title="Открыть ленту всех рассылок">
    <div class="badge-icon" id="historyRowIcon"></div>
    <div class="hr-text"><div class="hr-top"><span class="n">Объявления</span><span class="hr-time" id="historyRowTime"></span></div><div class="hr-preview" id="historyRowPreview"></div></div>
    <span class="unread-badge" id="historyRowBadge"></span>
  </div>
  <div id="list"></div>
</div>

<script src="ui-kit.js"></script>
<script src="roster.js"></script>
</body>
</html>
