<!doctype html>
<html lang="ru" data-theme="light" data-accent="azure">
<head>
<meta charset="utf-8">
<!-- Только свои скрипты, стили, шрифты и картинки; сеть — к серверу «Искры» (адрес задаётся настройкой,
     поэтому схемы, а не имя). Встроенный код запрещён целиком — скрипт окна в отдельном файле; style= разрешён. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src http: https: ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>Чат</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="redesign.css">
</head>
<body>
<div class="wintitlebar">
  <div class="who">
    <div class="dot" id="statusDot"></div>
    <div class="who-text"><div class="n" id="label"></div><div class="hsub" id="labelSub"></div></div>
  </div>
  <div id="tbExtra" style="-webkit-app-region:no-drag; display:flex; gap:2px; margin-left:auto;">
    <button class="icon-btn" id="historyBtn"><span></span>История</button>
  </div>
  <div class="wctl">
    <button class="icon-btn" id="wcMin"></button>
    <button class="icon-btn" id="wcMax"></button>
    <button class="icon-btn close" id="wcClose"></button>
  </div>
</div>
<div id="presencePanel"></div>

<div id="messages"></div>
<div id="replyBanner" class="reply-banner">
  <div class="rb-bar"></div>
  <div class="rb-content"><div class="rb-name"></div><div class="rb-text"></div></div>
  <button type="button" class="rb-close" id="rbClose"></button>
</div>
<div id="composer">
  <button class="round" id="attach" title="Прикрепить файл"></button>
  <input type="file" id="fileInput" multiple style="display:none">
  <div id="textWrap">
    <textarea id="text" placeholder="Написать сообщение..." rows="1"></textarea>
    <button type="button" id="emojiBtn" title="Эмодзи"></button>
  </div>
  <div id="emojiPanel"></div>
  <button class="round" id="send" title="Отправить"></button>
</div>

<div id="dropOverlay">
  <span></span>
  <div class="dtext">Отпустите, чтобы прикрепить</div>
</div>

<div id="historyPanel">
  <div id="hpSearchRow"></div>
  <div id="hpBody">
    <div id="hpDays"></div>
    <div id="hpMessages"></div>
  </div>
</div>

<script src="ui-kit.js"></script>
<script src="outbox.js"></script>
<script src="twemoji.min.js"></script>
<script src="chat.js"></script>
</body>
</html>
