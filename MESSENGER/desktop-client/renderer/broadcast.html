<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Только свои скрипты, стили, шрифты и картинки; сеть — к серверу «Искры» (адрес задаётся настройкой,
     поэтому схемы, а не имя). Встроенный код запрещён целиком — скрипт окна в отдельном файле; style= разрешён. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src http: https: ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>Объявления</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="broadcast.css">
</head>
<body>
<div id="dropOverlay">
  <span></span>
  <div class="dtext">Отпустите, чтобы прикрепить к рассылке</div>
</div>

<div class="wintitlebar">
  <span id="ttl" style="display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden; white-space:nowrap;"></span>
  <div id="tbExtra" style="-webkit-app-region:no-drag; display:flex; gap:2px; margin-left:auto;">
    <button class="icon-btn" id="historyBtn"><span></span>История</button>
    <button class="icon-btn" id="composeBtn" style="display:none"><span></span>Написать</button>
  </div>
  <div class="wctl">
    <button class="icon-btn" id="wcMin"></button>
    <button class="icon-btn" id="wcMax"></button>
    <button class="icon-btn close" id="wcClose"></button>
  </div>
</div>
<div id="composer">
  <p>Сообщение придёт всем сотрудникам сразу — как уведомление на компьютер, так и в историю рассылок.</p>
  <textarea id="text" placeholder="Текст рассылки..."></textarea>
  <div id="composerFiles"></div>
  <div id="composerRow2">
    <button id="attachBtn" title="Прикрепить файл"></button>
    <input type="file" id="fileInput" multiple style="display:none">
    <button id="sendBtn">Отправить всем</button>
  </div>
</div>
<div id="feed"></div>

<div id="historyPanel">
  <div id="hpSearchRow"></div>
  <div id="hpBody">
    <div id="hpDays"></div>
    <div id="hpMessages"></div>
  </div>
</div>

<script src="ui-kit.js"></script>
<script src="twemoji.min.js"></script>
<script src="broadcast.js"></script>
</body>
</html>
